name: Build and publish latest kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kernel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tooling
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Prepare version-bound release sources
        id: version
        run: python scripts/release_version.py --kind kernel
      - name: Build locked Release sources
        shell: pwsh
        run: ./scripts/build-kernel.ps1 -Configuration Release
      - name: Package binary and complete corresponding sources
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.releaseTag }}
        run: python scripts/package_kernel.py --release-tag "$env:RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-release-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
      - name: Push only the release source tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.releaseTag }}
        run: git push origin "refs/tags/$env:RELEASE_TAG"
      - name: Publish complete verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py --kind kernel --directory dist
